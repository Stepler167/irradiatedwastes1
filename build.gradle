// ForgeGradle 2.3 build for Forge 1.12.2. Easiest route: drop the "src" folder into the official
// Forge 1.12.2 MDK (which has the gradle wrapper) and use the MDK's own build.gradle.
buildscript {
    repositories {
        jcenter()
        mavenCentral()
        maven { name = "forge"; url = "https://maven.minecraftforge.net" }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}
apply plugin: 'net.minecraftforge.gradle.forge'

version = "1.0.0"
group = "com.example.irradiatedwastes"
archivesBaseName = "irradiatedwastes"

sourceCompatibility = targetCompatibility = '1.8'
compileJava.options.encoding = 'UTF-8'

minecraft {
    version = "1.12.2-14.23.5.2860"
    runDir = "run"
    mappings = "stable_39"
}

dependencies {
    // Optional: only needed once you call HBM classes directly.
    // deobfCompile files('libs/NTM-Extended-1.12.2-3.0.3.jar')
}
